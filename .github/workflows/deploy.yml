name: Fetch weather and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch weather data
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          mkdir site
          cp index.html site/
          for city in Chennai Tiruchirappalli Mumbai Delhi; do
            curl -sf "https://api.openweathermap.org/data/2.5/weather?q=$city&units=metric&appid=$WEATHER_API_KEY" \
            | jq '{city:.name, temp:.main.temp, feels_like:.main.feels_like, humidity:.main.humidity, description:.weather[0].description}'
          done | jq -s '{updated: (now|todate), cities: .}' > site/weather.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
